# Static analysis, formatting and unit tests.
# Based on inventree-app/.github/workflows/ci.yaml

name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Least privilege: the workflow only needs to read the repository
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: fvm-config-action
        uses: kuhnroyal/flutter-fvm-config-action@v2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      # Tests tagged "live" need a real InvenTree server (see test/live_server_test.dart)
      - name: Unit tests
        run: flutter test --exclude-tags live --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14
